name: Release Extension

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: npm
    - run: npm ci
    - name: Check that the tag matches package.json
      run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
    - name: Prepare CHANGELOG.md
      run: sed -i -e '/# Changelog/,/---/c\# Changelog' CHANGELOG.md
    - run: npm run package
    - name: Publish to Visual Studio Marketplace
      run: npx vsce publish --packagePath *.vsix
      env:
        VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
    - name: Publish to Open VSX Registry
      run: npx ovsx publish *.vsix
      env:
        OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
    - name: Attach the package to the release
      run: gh release upload "$GITHUB_REF_NAME" *.vsix
      env:
        GH_TOKEN: ${{ github.token }}
